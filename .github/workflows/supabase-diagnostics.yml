name: Supabase diagnostics
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Edition schema preflight
        required: true
        default: editions-preflight
      confirm:
        description: Type RUN to inspect the schema
        required: true
        default: NO
permissions:
  contents: read
jobs:
  snapshot:
    if: ${{ github.event.inputs.confirm == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Read edition schema and sync function
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          begin read only;
          select table_name, column_name, data_type from information_schema.columns
          where table_schema = 'public' and table_name in ('hall_of_fame_entries', 'public_hall_of_fame_entries', 'integrations_scorers')
          order by table_name, ordinal_position;
          select pg_get_functiondef('public.flbp_local_sync_hof_internal(text,jsonb)'::regprocedure);
          select version from supabase_migrations.schema_migrations order by version desc limit 5;
          select 'private_hof' as dataset, count(*) from public.hall_of_fame_entries
          union all select 'public_hof', count(*) from public.public_hall_of_fame_entries
          union all select 'scorers', count(*) from public.integrations_scorers;
          rollback;
          SQL
