name: Deploy Supabase database

on:
  push:
    branches:
      - main
    paths:
      - 'FLBP ONLINE/supabase/config.toml'
      - 'FLBP ONLINE/supabase/migrations/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview pending migrations or apply them
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      confirm:
        description: Type RUN to execute this workflow
        required: true
        default: 'NO'

permissions:
  contents: read

concurrency:
  group: supabase-db-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_WORKDIR: 'FLBP ONLINE'
  SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || 'kgwhcemqkgqvtsctnwql' }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  deploy:
    name: Push Supabase migrations
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate required configuration
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROJECT_ID:-}" || {
            echo "::error::Missing GitHub variable SUPABASE_PROJECT_ID"
            exit 1
          }
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "::error::Missing GitHub secret SUPABASE_ACCESS_TOKEN"
            exit 1
          }
          test -n "${SUPABASE_DB_PASSWORD:-}" || {
            echo "::error::Missing GitHub secret SUPABASE_DB_PASSWORD"
            exit 1
          }

      - name: Link Supabase project
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations
        run: |
          set -euo pipefail
          supabase migration list --linked
          supabase db push --linked --dry-run

      - name: Apply pending migrations
        if: ${{ github.event_name == 'push' || github.event.inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          supabase db push --linked --yes
