name: Deploy Supabase database

# Applica le migration di "FLBP ONLINE/supabase/migrations" al progetto hosted.
#
# dry-run non modifica schema o storia remota. apply non ripara la storia:
# un disallineamento deve fallire e venire esaminato dall'operatore.
# repair-history è un'operazione manuale separata, con versioni esplicite e
# conferma REPAIR; non applica SQL. Vedi docs/SUPABASE_DATABASE_WORKFLOW.md.

on:
  push:
    branches:
      - main
    paths:
      - 'FLBP ONLINE/supabase/config.toml'
      - 'FLBP ONLINE/supabase/migrations/**'
      - '.github/workflows/supabase-db-deploy.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview, apply migrations, or explicitly repair migration history
        required: true
        type: choice
        options:
          - dry-run
          - apply
          - repair-history
        default: dry-run
      confirm:
        description: Type RUN for dry-run/apply, or REPAIR for repair-history
        required: true
        default: 'NO'
      repair_versions:
        description: For repair-history only, space-separated 14-digit migration versions already reviewed
        required: false
        default: ''
      repair_status:
        description: For repair-history only, the reviewed history status (does not execute SQL)
        required: true
        type: choice
        options:
          - applied
          - reverted
        default: applied

permissions:
  contents: read

concurrency:
  group: supabase-db-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || 'kgwhcemqkgqvtsctnwql' }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  deploy:
    name: Push Supabase migrations
    if: ${{ github.event_name == 'push' || (github.event.inputs.mode != 'repair-history' && github.event.inputs.confirm == 'RUN') || (github.event.inputs.mode == 'repair-history' && github.event.inputs.confirm == 'REPAIR') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        shell: bash
        # Il progetto Supabase vive nel sottodir "FLBP ONLINE": senza questo
        # workdir il CLI girava nella root del repo, non vedeva ne' config.toml
        # ne' le migration, e i run "verdi" erano dei no-op.
        working-directory: FLBP ONLINE

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate required configuration
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROJECT_ID:-}" || {
            echo "::error::Missing GitHub variable SUPABASE_PROJECT_ID"
            exit 1
          }
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "::error::Missing GitHub secret SUPABASE_ACCESS_TOKEN"
            exit 1
          }
          test -n "${SUPABASE_DB_PASSWORD:-}" || {
            echo "::error::Missing GitHub secret SUPABASE_DB_PASSWORD"
            exit 1
          }
          test -f supabase/config.toml || {
            echo "::error::supabase/config.toml not found in workdir (FLBP ONLINE)"
            exit 1
          }
          dup="$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -c1-14 | sort | uniq -d)"
          if [ -n "$dup" ]; then
            echo "::error::Duplicate migration versions (db push would fail): $dup"
            exit 1
          fi

      - name: Link Supabase project
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Migration status before changes
        run: |
          set -euo pipefail
          supabase migration list --linked

      - name: Repair explicitly reviewed migration history
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'repair-history' && github.event.inputs.confirm == 'REPAIR' }}
        env:
          REPAIR_VERSIONS: ${{ github.event.inputs.repair_versions }}
          REPAIR_STATUS: ${{ github.event.inputs.repair_status }}
        run: |
          set -euo pipefail
          if [[ ! "$REPAIR_VERSIONS" =~ ^[0-9]{14}(\ [0-9]{14})*$ ]]; then
            echo "::error::Provide explicit 14-digit migration versions separated by single spaces"
            exit 1
          fi
          if [[ "$REPAIR_STATUS" != applied && "$REPAIR_STATUS" != reverted ]]; then
            echo "::error::Repair status must be applied or reverted"
            exit 1
          fi
          read -r -a versions <<< "$REPAIR_VERSIONS"
          if [[ "$REPAIR_STATUS" == applied ]]; then
            for version in "${versions[@]}"; do
              compgen -G "supabase/migrations/${version}_*.sql" > /dev/null || {
                echo "::error::No local migration for reviewed version $version"
                exit 1
              }
            done
          fi
          echo "Explicit history repair: ${REPAIR_STATUS} for ${versions[*]}"
          supabase migration repair --status "$REPAIR_STATUS" "${versions[@]}"
          supabase migration list --linked

      - name: Preview pending migrations
        if: ${{ github.event_name == 'push' || github.event.inputs.mode != 'repair-history' }}
        run: |
          set -euo pipefail
          supabase db push --dry-run

      - name: Apply pending migrations
        if: ${{ github.event_name == 'push' || github.event.inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          supabase db push --yes

      - name: Verify convergence
        if: ${{ github.event_name == 'push' || github.event.inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          out="$(supabase db push --dry-run 2>&1)"
          echo "$out"
          if ! echo "$out" | grep -qi 'up to date'; then
            echo "::error::Migrations did NOT converge: dry-run still reports pending work"
            exit 1
          fi
