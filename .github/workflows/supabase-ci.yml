name: Supabase CI

on:
  pull_request:
    paths:
      - 'FLBP ONLINE/supabase/**'
      - '.github/workflows/supabase-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: FLBP ONLINE

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Apply migrations to a clean local database
        run: |
          set -euo pipefail
          supabase db start

      - name: Lint local database schema
        run: |
          set -euo pipefail
          # plpgsql_check cannot resolve temp tables created inside a function
          # at runtime. Keep error-level linting strict, but allow the one exact
          # pre-existing false positive from the simulation-only seed helper.
          lint_output="$(NO_COLOR=1 supabase db lint --local --level error --fail-on none)"
          printf '%s\n' "$lint_output"
          lint_json="$(printf '%s\n' "$lint_output" | sed -n '/^\[/,$p')"
          test -n "$lint_json" || {
            echo "::error::Supabase lint did not return its expected JSON report"
            exit 1
          }
          unexpected_errors="$(printf '%s\n' "$lint_json" | jq '[
            .[]
            | .function as $function
            | .issues[]
            | select(.level == "error")
            | select(
                ($function != "public.flbp_sim_seed_fanta_pretournament")
                or (.message != "relation \"_sim_eligible_players\" does not exist")
              )
          ] | length')"
          test "$unexpected_errors" -eq 0 || {
            echo "::error::Supabase lint found $unexpected_errors unexpected schema error(s)"
            exit 1
          }

      - name: Stop local Supabase
        if: always()
        run: |
          supabase stop --no-backup || true
