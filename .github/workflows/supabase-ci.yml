name: Supabase CI

on:
  pull_request:
    paths:
      - 'FLBP ONLINE/supabase/**'
      - 'FLBP ONLINE/scripts/test-admin-auth.mjs'
      - 'FLBP ONLINE/scripts/test-database-restore.mjs'
      - 'FLBP ONLINE/scripts/test-database-restore-schema.mjs'
      - 'FLBP ONLINE/scripts/test-referee-security.mjs'
      - 'FLBP ONLINE/scripts/test-referee-http.mjs'
      - 'FLBP ONLINE/scripts/test-referee-concurrency.mjs'
      - '.github/workflows/supabase-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: FLBP ONLINE

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Apply migrations to a clean local database
        run: |
          set -euo pipefail
          supabase db start

      - name: Lint local database schema
        run: |
          set -euo pipefail
          # plpgsql_check cannot resolve temp tables created inside a function
          # at runtime. Keep error-level linting strict, but allow the one exact
          # pre-existing false positive from the simulation-only seed helper.
          lint_output="$(NO_COLOR=1 supabase db lint --local --level error --fail-on none)"
          printf '%s\n' "$lint_output"
          lint_json="$(printf '%s\n' "$lint_output" | sed -n '/^\[/,$p')"
          test -n "$lint_json" || {
            echo "::error::Supabase lint did not return its expected JSON report"
            exit 1
          }
          unexpected_errors="$(printf '%s\n' "$lint_json" | jq '[
            .[]
            | .function as $function
            | .issues[]
            | select(.level == "error")
            | select(
                ($function != "public.flbp_sim_seed_fanta_pretournament")
                or (.message != "relation \"_sim_eligible_players\" does not exist")
              )
          ] | length')"
          test "$unexpected_errors" -eq 0 || {
            echo "::error::Supabase lint found $unexpected_errors unexpected schema error(s)"
            exit 1
          }

      - name: Install PostgreSQL test client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Verify Admin authorization with real SQL roles and RLS
        run: node scripts/test-admin-auth.mjs --database-url postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Verify read-only production contract probe
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -X -v ON_ERROR_STOP=1 -f supabase/tests/deployed_stabilization_readonly.sql

      - name: Verify transactional restore against the complete migrated schema
        run: node scripts/test-database-restore-schema.mjs --database-url postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Verify referee authorization and scoped writes
        run: node scripts/test-referee-security.mjs --database-url postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Verify concurrent Admin and referee writes
        run: node scripts/test-referee-concurrency.mjs --database-url postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Verify HTTP rejections preserve audit and older client queues
        env:
          PGRST_DB_URI: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_SERVER_HOST: 127.0.0.1
          PGRST_SERVER_PORT: '3000'
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/flbp-postgrest"
          mkdir -p "$tools_dir"
          curl --fail --location --connect-timeout 15 --max-time 120 --retry 2 -o "$tools_dir/postgrest.tar.xz" https://github.com/PostgREST/postgrest/releases/download/v16.4/postgrest-v16.4-linux-static-x86-64.tar.xz
          printf '%s  %s\n' b47ecc82fce1dcebbbc4183d839e52f07f7630c9d7ad0f54db753d1939299354 "$tools_dir/postgrest.tar.xz" | sha256sum --check
          tar -xJf "$tools_dir/postgrest.tar.xz" -C "$tools_dir"
          "$tools_dir/postgrest" > "$tools_dir/server.log" 2>&1 &
          postgrest_pid=$!
          trap 'kill "$postgrest_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            kill -0 "$postgrest_pid" 2>/dev/null || { cat "$tools_dir/server.log"; exit 1; }
            if curl --silent --fail --connect-timeout 1 --max-time 2 http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail --connect-timeout 1 --max-time 2 http://127.0.0.1:3000/ >/dev/null || { cat "$tools_dir/server.log"; exit 1; }
          node scripts/test-referee-http.mjs --database-url postgresql://postgres:postgres@127.0.0.1:54322/postgres --postgrest-url http://127.0.0.1:3000 || { cat "$tools_dir/server.log"; exit 1; }

      - name: Stop local Supabase
        if: always()
        run: |
          supabase stop --no-backup || true
