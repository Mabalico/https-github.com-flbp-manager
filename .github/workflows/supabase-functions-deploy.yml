name: Deploy Supabase Edge Functions

# push su main: solo anteprima, non pubblica nessuna funzione (la CLI non ha
# un dry-run per "functions deploy": si controlla cosa verrebbe pubblicato).
# Il deploy parte esclusivamente da workflow_dispatch con confirm=RUN, dentro
# l'environment "production" (i revisori obbligatori si impostano nel repository).

on:
  push:
    branches:
      - main
    paths:
      - 'FLBP ONLINE/supabase/config.toml'
      - 'FLBP ONLINE/supabase/functions/**'
  workflow_dispatch:
    inputs:
      function_name:
        description: Edge Function name, or all
        required: true
        default: all
      confirm:
        description: Type RUN to deploy Edge Functions
        required: true
        default: 'NO'

permissions:
  contents: read

concurrency:
  group: supabase-functions-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_WORKDIR: 'FLBP ONLINE'
  SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || 'kgwhcemqkgqvtsctnwql' }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    name: Deploy Edge Functions
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Versione fissata: la CLI v3 (2026-11-02) chiede conferma per ogni
          # modifica a un progetto hosted. Aggiornare solo insieme ai comandi.
          version: 2.122.1

      - name: Validate required configuration
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROJECT_ID:-}" || {
            echo "::error::Missing GitHub variable SUPABASE_PROJECT_ID"
            exit 1
          }
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "::error::Missing GitHub secret SUPABASE_ACCESS_TOKEN"
            exit 1
          }

      - name: Preview Edge Functions (push dry-run)
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          count=0
          for dir in "$SUPABASE_WORKDIR"/supabase/functions/*; do
            [ -d "$dir" ] || continue
            test -f "$dir/index.ts" || {
              echo "::error::Edge Function $(basename "$dir") has no index.ts"
              exit 1
            }
            echo "Would deploy: $(basename "$dir")"
            count=$((count + 1))
          done
          test "$count" -gt 0 || {
            echo "::error::No Edge Function found in $SUPABASE_WORKDIR/supabase/functions"
            exit 1
          }
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy Edge Functions
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          FUNCTION_NAME: ${{ github.event.inputs.function_name || 'all' }}
        run: |
          set -euo pipefail

          deploy_function() {
            local name="$1"
            echo "Deploying Supabase Edge Function: ${name}"
            supabase functions deploy "$name" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --use-api \
              --workdir "$SUPABASE_WORKDIR"
          }

          if [ "$FUNCTION_NAME" = "all" ]; then
            for dir in "$SUPABASE_WORKDIR"/supabase/functions/*; do
              [ -d "$dir" ] || continue
              deploy_function "$(basename "$dir")"
            done
          else
            deploy_function "$FUNCTION_NAME"
          fi
