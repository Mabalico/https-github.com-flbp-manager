name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'FLBP ONLINE/supabase/config.toml'
      - 'FLBP ONLINE/supabase/functions/**'
  workflow_dispatch:
    inputs:
      function_name:
        description: Edge Function name, or all
        required: true
        default: all
      confirm:
        description: Type RUN to deploy Edge Functions
        required: true
        default: 'NO'

permissions:
  contents: read

concurrency:
  group: supabase-functions-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_WORKDIR: 'FLBP ONLINE'
  SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || 'kgwhcemqkgqvtsctnwql' }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    name: Deploy Edge Functions
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate required configuration
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROJECT_ID:-}" || {
            echo "::error::Missing GitHub variable SUPABASE_PROJECT_ID"
            exit 1
          }
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "::error::Missing GitHub secret SUPABASE_ACCESS_TOKEN"
            exit 1
          }

      - name: Deploy Edge Functions
        env:
          FUNCTION_NAME: ${{ github.event.inputs.function_name || 'all' }}
        run: |
          set -euo pipefail

          deploy_function() {
            local name="$1"
            echo "Deploying Supabase Edge Function: ${name}"
            supabase functions deploy "$name" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --use-api \
              --workdir "$SUPABASE_WORKDIR"
          }

          if [ "$FUNCTION_NAME" = "all" ]; then
            for dir in "$SUPABASE_WORKDIR"/supabase/functions/*; do
              [ -d "$dir" ] || continue
              deploy_function "$(basename "$dir")"
            done
          else
            deploy_function "$FUNCTION_NAME"
          fi
